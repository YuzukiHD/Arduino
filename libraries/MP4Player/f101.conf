# MP4Player: H.264 on the display video plane, AAC through the on-chip codec, files on the SD card
CONFIG_MP4_DEMUX=y
CONFIG_OPENCORE_AAC=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_VDEC=y
CONFIG_DISPLAY=y
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_DMA=y
CONFIG_GPIO=y
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
# the SD bounce buffer comes from the system heap
CONFIG_HEAP_MEM_POOL_SIZE=262144
# the audio thread (priority 3) has to run while the sketch loop spins
CONFIG_MAIN_THREAD_PRIORITY=6
