# CherryUSB host stack: EHCI + OHCI companion on the shared PHY
CONFIG_CHERRYUSB=y
CONFIG_CHERRYUSB_HOST=y
CONFIG_CHERRYUSB_HOST_EHCI_CUSTOM=y
CONFIG_CHERRYUSB_HOST_CDC_ACM=y
CONFIG_CHERRYUSB_HOST_MSC=y
CONFIG_CHERRYUSB_HOST_CH34X=y
CONFIG_USB_PHY_SUNXI=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# a second FAT volume: the SD card keeps the name "SD", USB drives are "USB"
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=2
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD,USB"
