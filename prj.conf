# Arduino core configuration, common to all variants
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Serial owns the console UART: no shell, no log output on it (log calls stay compiled in)
CONFIG_SHELL=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n
CONFIG_DEVMEM_SHELL=n

# sketches use big stacks, String/new use the libc heap that takes all RAM above the image
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_HEAP_MEM_POOL_SIZE=16384
